name: CI

# A pull request run covers a branch; the push trigger is for main only, so a
# branch push does not run twice.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest

    # The query tests run against a real Postgres rather than a mock.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: wicken
          POSTGRES_PASSWORD: wicken
          POSTGRES_DB: wicken
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wicken"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://wicken:wicken@127.0.0.1:5432/wicken
      TEST_DATABASE_URL: postgresql://wicken:wicken@127.0.0.1:5432/wicken_test
      # Throwaway: nothing in CI signs a cookie that has to be read back later.
      BETTER_AUTH_SECRET: ci-secret-not-used-for-anything-real

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # Fails if the lockfile disagrees with package.json, which catches a
      # dependency added locally but never committed.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm db:migrate

      - run: pnpm test

      - run: pnpm build
